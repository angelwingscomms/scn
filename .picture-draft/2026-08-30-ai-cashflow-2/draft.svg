<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <rect width="1024" height="1536" fill="#08080C"/>
  <!-- cover 620x930 centered -->
  <rect x="202" y="303" width="620" height="930" rx="6" fill="#0B0B0F" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- hairline inset 10mm -->
  <rect x="225" y="326" width="574" height="884" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <!-- subtle radial orb violet 15% -->
  <ellipse cx="512" cy="680" rx="220" ry="180" fill="#5E6AD2" opacity="0.07"/>
  <!-- grain placeholder -->
  <!-- Top label -->
  <text x="512" y="395" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#EDE8E1" opacity="0.55">AI CASHFLOW</text>
  <!-- Title 2.0 -->
  <text x="512" y="485" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="88" font-weight="400" letter-spacing="-2" fill="#F7F5F0">BLUEPRINT</text>
  <text x="512" y="545" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="88" font-weight="400" letter-spacing="-2" fill="#5E6AD2">2.0</text>
  <!-- subtitle pill dense proof -->
  <rect x="315" y="575" width="394" height="24" rx="12" fill="#1A1A22" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="512" y="591" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#8A8F98">25 HUSTLES · 1000 PROMPTS · TEMPLATES</text>
  
  <!-- Icon: briefcase with stacked cards fanned, violet glow -->
  <g transform="translate(512, 785)">
    <!-- stacked cards fanned behind -->
    <rect x="-95" y="-85" width="190" height="120" rx="8" fill="none" stroke="#F7F5F0" stroke-width="1.8" opacity="0.22" transform="rotate(-8)"/>
    <rect x="-95" y="-85" width="190" height="120" rx="8" fill="none" stroke="#F7F5F0" stroke-width="1.8" opacity="0.35" transform="rotate(-4)"/>
    <rect x="-95" y="-85" width="190" height="120" rx="8" fill="#15151C" stroke="#F7F5F0" stroke-width="1.8" opacity="0.95"/>
    <!-- AI spark particle above latch -->
    <circle cx="0" cy="-95" r="3.5" fill="#5E6AD2" opacity="0.9"/>
    <circle cx="0" cy="-95" r="8" fill="#5E6AD2" opacity="0.15"/>
    <!-- briefcase -->
    <rect x="-110" y="-30" width="220" height="130" rx="10" fill="#1A1A22" stroke="#F7F5F0" stroke-width="1.8" opacity="0.98"/>
    <rect x="-45" y="-45" width="90" height="15" rx="7" fill="none" stroke="#F7F5F0" stroke-width="1.8" opacity="0.9"/>
    <rect x="-25" y="-18" width="50" height="22" rx="4" fill="#5E6AD2" opacity="0.95"/>
    <rect x="-12" y="-12" width="24" height="10" rx="2" fill="#F7F5F0" opacity="0.95"/>
    <!-- violet edge light bottom -->
