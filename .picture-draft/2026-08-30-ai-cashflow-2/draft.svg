  <text x="512" y="1060" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.5" fill="#EDE8E1" opacity="0.85">MIKE I. KEKONG</text>
  <text x="512" y="1085" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" letter-spacing="2.2" fill="#8A8F98">PREMIUM TOOLKIT  •  SYSTEM  •  ASSETS</text>
