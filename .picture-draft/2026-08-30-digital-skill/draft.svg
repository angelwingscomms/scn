<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <rect width="1024" height="1536" fill="#08080A"/>
  <!-- cover 620x930 centered: x=202 y=303 (1536-930)/2=303 -->
  <rect x="202" y="303" width="620" height="930" rx="6" fill="#08080A" stroke="#F7F5F1" stroke-width="1.2" stroke-opacity="0.08"/>
  <!-- inner hairline inset 10mm approx 28px -->
  <rect x="230" y="331" width="564" height="874" rx="4" fill="none" stroke="#F7F5F1" stroke-opacity="0.08" stroke-width="1"/>
  <!-- subtle radial orb behind title -->
  <ellipse cx="512" cy="620" rx="220" ry="140" fill="#C9A86A" opacity="0.06"/>
  <!-- grain hint via faint overlay rect -->
  <rect x="202" y="303" width="620" height="930" fill="#F7F5F1" opacity="0.015"/>

  <!-- Top small: THE DIGITAL SKILL -->
  <text x="512" y="410" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="4.5" fill="#F7F5F1" opacity="0.55">THE DIGITAL SKILL</text>

  <!-- Title: NOBODY IS / TEACHING -->
  <text x="512" y="520" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5" fill="#F7F5F1">NOBODY IS</text>
  <text x="512" y="585" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5" fill="#F7F5F1">TEACHING</text>

  <!-- Sub: IN SCHOOL -->
  <text x="512" y="630" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#C9A86A">IN SCHOOL</text>

  <!-- Thin hairline rule -->
  <rect x="397" y="655" width="230" height="1" fill="#F7F5F1" opacity="0.12" rx="0.5"/>
  <text x="512" y="680" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#F7F5F1" opacity="0.45">SKILLS QUIETLY PAYING IN DOLLARS</text>

  <!-- Center icon: cap tassel morphing -->
  <g transform="translate(512, 840)">
    <!-- cap outline -->
    <path d="M -110 -30 L 0 -85 L 110 -30 L 0 15 Z" fill="none" stroke="#F7F5F1" stroke-width="3.2" stroke-linejoin="round" opacity="0.92"/>
    <path d="M -110 -30 L -110 25 L -55 50 L 55 50 L 110 25 L 110 -30" fill="none" stroke="#F7F5F1" stroke-width="3.2" stroke-linejoin="round" opacity="0.92"/>
    <!-- tassel string morphing -->
    <path d="M 35 -10 C 70 -5 85 25 78 55 C 72 85 40 115 10 135" fill="none" stroke="#F7F5F1" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M 10 135 C 28 145 68 148 90 130 C 108 112 112 85 100 62" fill="none" stroke="#C9A86A" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
    <!-- $ coin -->
    <circle cx="90" cy="105" r="42" fill="none" stroke="#C9A86A" stroke-width="3" />
    <text x="90" y="120" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#C9A86A">$</text>
    <!-- small cursor hint -->
    <path d="M 125 70 L 138 95 L 132 96 L 135 104 L 131 105 L 128 97 L 122 95 Z" fill="none" stroke="#F7F5F1" stroke-width="1.1" opacity="0.7"/>
  </g>

  <!-- Footer author -->
  <rect x="397" y="1130" width="230" height="1" fill="#F7F5F1" opacity="0.1" rx="0.5"/>
  <text x="512" y="1165" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#C9A86A">MIKE I. KEKONG</text>
  <text x="512" y="1182" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" letter-spacing="2.5" fill="#F7F5F1" opacity="0.38">EDUCATION • INCOME • SYSTEM</text>
</svg>
