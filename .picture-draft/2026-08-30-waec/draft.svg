<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <rect width="1024" height="1536" fill="#0E1015"/>
  <!-- cover centered 620x930 -->
  <rect x="202" y="303" width="620" height="930" rx="6" fill="#F7F5F0" />
  <!-- hairline 8% inset 10mm (~38px) -->
  <rect x="240" y="341" width="544" height="854" rx="4" fill="none" stroke="#0B1C33" stroke-width="0.8" opacity="0.08"/>
  <!-- grain subtle -->
  <rect x="202" y="303" width="620" height="930" rx="6" fill="none" opacity="0.03"/>
  <!-- Top label -->
  <text x="512" y="395" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.5" fill="#0B1C33" opacity="0.55">90-DAY TOOLKIT</text>
  <!-- Title WAEC -->
  <text x="512" y="465" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="72" font-weight="400" letter-spacing="-2.5" fill="#0B1C33">WAEC</text>
  <text x="512" y="525" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="72" font-weight="400" letter-spacing="-2.5" fill="#0B1C33">A+</text>
  <text x="512" y="575" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="28" font-weight="400" letter-spacing="3" fill="#0B1C33">BLUEPRINT</text>
  <!-- thin rule -->
  <rect x="402" y="595" width="220" height="1" fill="#0B1C33" opacity="0.12"/>
  <text x="512" y="620" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" letter-spacing="1.8" fill="#0B1C33" opacity="0.5">EXCELLENT GRADES WITHOUT PANIC</text>
  <!-- Icon: A+ shield with step path -->
  <g transform="translate(512, 760)">
    <!-- shield -->
    <path d="M -95 -65 L 0 -100 L 95 -65 L 95 45 C 95 85 55 115 0 140 C -55 115 -95 85 -95 45 Z" fill="none" stroke="#0B1C33" stroke-width="2.2"/>
    <path d="M -78 -55 L 0 -88 L 78 -55 L 78 45 C 78 78 48 103 0 124 C -48 103 -78 78 -78 45 Z" fill="none" stroke="#0B1C33" stroke-width="0.9" opacity="0.35"/>
    <!-- A+ -->
    <text x="0" y="15" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="58" font-weight="400" fill="#C2782E">A+</text>
    <!-- step path bottom -->
    <path d="M -70 70 L -35 70 L -35 50 L 0 50 L 0 30 L 35 30 L 35 10 L 70 10" fill="none" stroke="#C2782E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="70,10 62,2 62,18" fill="#C2782E"/>
  </g>
  <!-- radial orb very subtle behind title -->
  <ellipse cx="512" cy="485" rx="220" ry="140" fill="#0B1C33" opacity="0.025"/>
  <!-- bottom -->
  <rect x="402" y="985" width="220" height="1" fill="#0B1C33" opacity="0.12"/>
  <text x="512" y="1065" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="3.2" fill="#0B1C33" opacity="0.85">MIKE I. KEKONG</text>
  <text x="512" y="1085" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="400" letter-spacing="2" fill="#0B1C33" opacity="0.35">90-DAY SYSTEM • STRATEGY • CALM</text>
</svg>
