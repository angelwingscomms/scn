<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <rect width="1024" height="1536" fill="#08080A"/>
  <!-- Cover 620x930 centered: x=(1024-620)/2=202, y=(1536-930)/2=303 -->
  <rect x="202" y="303" width="620" height="930" rx="6" fill="#0A0A0B" stroke="#F7F5F0" stroke-width="1" opacity="0.08"/>
  <!-- hairline border inset 10mm ~ 38px inside cover -->
  <rect x="232" y="333" width="560" height="870" rx="4" fill="none" stroke="#F7F5F0" stroke-width="1" opacity="0.08"/>
  <!-- subtle radial orb behind title -->
  <ellipse cx="512" cy="540" rx="260" ry="180" fill="#C9A86A" opacity="0.06"/>
  <!-- SILENT -->
  <text x="512" y="515" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="102" font-weight="400" letter-spacing="-2" fill="#F7F5F0">SILENT</text>
  <!-- POVERTY -->
  <text x="512" y="615" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="102" font-weight="400" letter-spacing="-2" fill="#F7F5F0">POVERTY</text>
  <!-- hairline under title -->
  <rect x="382" y="640" width="260" height="1" fill="#F7F5F0" opacity="0.15"/>
  <!-- subtitle -->
  <text x="512" y="678" text-anchor="middle" font-family="Inter, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="1.2" fill="#F7F5F0" opacity="0.85">Why Employed People</text>
  <text x="512" y="702" text-anchor="middle" font-family="Inter, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="1.2" fill="#F7F5F0" opacity="0.85">Are Still Broke</text>
  <!-- pill badge -->
  <rect x="302" y="730" width="420" height="26" rx="13" fill="#C9A86A"/>
  <text x="512" y="747" text-anchor="middle" font-family="Inter, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="#0A0A0B">( 5 INCOME LEAKS DRAINING YOUR FUTURE )</text>
  <!-- center wallet icon -->
  <g transform="translate(512, 890)">
    <rect x="-110" y="-70" width="220" height="135" rx="12" fill="none" stroke="#F7F5F0" stroke-width="2.8" opacity="0.95"/>
    <rect x="-110" y="-30" width="220" height="1.5" fill="#F7F5F0" opacity="0.15"/>
    <rect x="65" y="-45" width="45" height="38" rx="6" fill="#1A1A1E" stroke="#F7F5F0" stroke-width="2.2"/>
    <!-- 5 drips -->
    <rect x="-72" y="65" width="3.5" height="28" rx="1.7" fill="#C9A86A" opacity="0.9"/>
    <rect x="-37" y="65" width="3.5" height="42" rx="1.7" fill="#C9A86A" opacity="0.9"/>
    <rect x="-2" y="65" width="3.5" height="58" rx="1.7" fill="#C9A86A" opacity="0.9"/>
    <rect x="33" y="65" width="3.5" height="42" rx="1.7" fill="#C9A86A" opacity="0.9"/>
    <rect x="68" y="65" width="3.5" height="28" rx="1.7" fill="#C9A86A" opacity="0.9"/>
    <circle cx="-70.2" cy="99" r="5.5" fill="#C9A86A"/>
    <circle cx="-35.2" cy="113" r="4.8" fill="#C9A86A"/>
    <circle cx="-0.2" cy="129" r="5.5" fill="#C9A86A"/>
    <circle cx="34.8" cy="113" r="4.8" fill="#C9A86A"/>
    <circle cx="69.8" cy="99" r="5.5" fill="#C9A86A"/>
    <ellipse cx="0" cy="146" rx="110" ry="10" fill="#000" opacity="0.28"/>
  </g>
  <!-- bottom author -->
  <rect x="312" y="1085" width="400" height="1" fill="#F7F5F0" opacity="0.12"/>
  <text x="512" y="1115" text-anchor="middle" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#C9A86A">MIKE I. KEKONG</text>
  <!-- grain hint -->
  <!-- 3% grain simulated via opacity dots not needed flat -->
</svg>
